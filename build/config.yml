version: '3'

info:
  companyName: "xutiancheng"
  productName: "Aiko"
  productIdentifier: "com.xutiancheng.aiko"
  description: "AI Desktop Pet"
  copyright: "Copyright © 2025 xutiancheng"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task darwin:build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
