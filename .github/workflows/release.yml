name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: write   # needed to create GitHub Release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache create-dmg
        id: cache-create-dmg
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/create-dmg
          key: create-dmg-${{ runner.os }}

      - name: Install create-dmg
        if: steps.cache-create-dmg.outputs.cache-hit != 'true'
        run: brew install create-dmg

      - name: Build Aiko.app
        run: wails build -trimpath -ldflags="-s -w"

      # Ad-hoc sign with entitlements (network + microphone).
      # Sign frameworks first, then the app bundle — avoids deprecated --deep flag.
      # Users must run `xattr -cr Aiko.app` after unzipping, or right-click → Open.
      - name: Sign app (ad-hoc)
        run: |
          find build/bin/Aiko.app/Contents/Frameworks -name "*.framework" -o -name "*.dylib" 2>/dev/null | \
            xargs -I{} codesign --force --sign - --identifier com.xutiancheng.aiko {}
          codesign --force --sign - \
            --identifier com.xutiancheng.aiko \
            --entitlements build/darwin/Aiko.entitlements \
            build/bin/Aiko.app

      - name: Package DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          create-dmg \
            --volname "Aiko ${VERSION}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Aiko.app" 150 200 \
            --hide-extension "Aiko.app" \
            --app-drop-link 450 200 \
            "build/bin/Aiko-${VERSION}.dmg" \
            "build/bin/Aiko.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/bin/Aiko-*.dmg
          generate_release_notes: true
